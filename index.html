
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDITH AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #081321;
  color: white;
}

header {
  background: #102d46;
  padding: 20px;
  text-align: center;
  border-bottom: 2px solid #00cfff;
}

header h1 {
  margin: 0;
  color: #00d9ff;
  letter-spacing: 4px;
}

header p { color: #b7dce9; }

#chat {
  height: calc(100dvh - 190px);
  overflow-y: auto;
  padding: 16px;
}

.message {
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.bot {
  background: #173b55;
  border: 1px solid #00bce8;
}

.user {
  background: #075c82;
  margin-left: auto;
}

.controls {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 12px;
  background: #102d46;
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #00cfff;
  background: #081321;
  color: white;
  font-size: 16px;
}

button {
  background: #00bce8;
  color: #001521;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-weight: bold;
}

#voice { background: #b5eaff; }
</style>
</head>

<body>

<header>
<h1>EDITH AI</h1>
<p>Your Personal Digital Assistant</p>
</header>

<div id="chat" aria-live="polite"></div>

<div class="controls">
<input id="input" placeholder="Ask Edith anything..." />
<button id="send">SEND</button>
<button id="voice">🎤</button>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-IN";
  speechSynthesis.speak(speech);
}

function remember(text, type) {
  try {
    const history = JSON.parse(
      localStorage.getItem("edithHistory") || "[]"
    );
    history.push({text, type});
    localStorage.setItem(
      "edithHistory",
      JSON.stringify(history.slice(-50))
    );
  } catch(e) {}
}

function respond(message) {
  const q = message.toLowerCase();

  if (q.includes("hello") || q.includes("hi"))
    return "Hello! I am Edith. How can I help you today?";

  if (q.includes("your name"))
    return "My name is Edith, your personal digital assistant.";

  if (q.includes("who created you"))
    return "I am Edith, created as your personal AI project.";

  if (q.includes("time"))
    return "The current time is " +
      new Date().toLocaleTimeString();

  if (q.includes("date"))
    return "Today's date is " +
      new Date().toLocaleDateString();

  if (q.includes("jee"))
    return "I can help you study Physics, Chemistry and Mathematics for JEE.";

  if (q.includes("thank"))
    return "You're welcome! What else can I help you with?";

  if (q.includes("how are you"))
    return "I am running well! Ready to help you.";

  return "I am still learning! I can answer a few built-in questions right now. A real AI connection will be needed for broader intelligent answers.";
}

function sendMessage() {
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  remember(message, "user");
  input.value = "";

  const answer = respond(message);
  addMessage(answer, "bot");
  remember(answer, "bot");
  speak(answer);
}

document.getElementById("send")
  .addEventListener("click", sendMessage);

input.addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

document.getElementById("voice")
  .addEventListener("click", () => {
    const Recognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!Recognition) {
      addMessage("Voice input is not supported in this browser. Try Chrome.", "bot");
      return;
    }

    const recognition = new Recognition();
    recognition.lang = "en-IN";
    recognition.onresult = event => {
      input.value = event.results[0][0].transcript;
      sendMessage();
    };
    recognition.onerror = () =>
      addMessage("Microphone unavailable. Please check browser permissions.", "bot");

    recognition.start();
  });

try {
  const history = JSON.parse(
    localStorage.getItem("edithHistory") || "[]"
  );
  history.forEach(item => addMessage(item.text, item.type));
} catch(e) {}

if (!chat.children.length) {
  addMessage("Hello! I am Edith. Your digital assistant is ready!", "bot");
}
</script>

</body>
</html>
